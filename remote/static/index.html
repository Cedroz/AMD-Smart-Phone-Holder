<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arm Remote">
<title>Arm Remote</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --text: #14161a;
    --muted: #6b7280;
    --border: #dfe2e8;
    --ok: #16a34a;
    --ok-soft: #dcf5e4;
    --bad: #dc2626;
    --ambient: #2563eb;
    --ambient-soft: #dbe6fd;
    --spot: #b45309;
    --spot-soft: #fdecd3;
    --off: #dc2626;
    --off-soft: #fde2e2;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1014;
      --surface: #171a20;
      --surface-2: #20242c;
      --text: #f2f3f5;
      --muted: #9aa1ad;
      --border: #2a2f38;
      --ok: #22c55e;
      --ok-soft: #12301d;
      --bad: #f87171;
      --ambient: #4f8cff;
      --ambient-soft: #1a2640;
      --spot: #f59e0b;
      --spot-soft: #33260f;
      --off: #f05252;
      --off-soft: #3a1a1c;
      --on-accent: #0e1014;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;
    --surface: #171a20;
    --surface-2: #20242c;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --border: #2a2f38;
    --ok: #22c55e;
    --ok-soft: #12301d;
    --bad: #f87171;
    --ambient: #4f8cff;
    --ambient-soft: #1a2640;
    --spot: #f59e0b;
    --spot-soft: #33260f;
    --off: #f05252;
    --off-soft: #3a1a1c;
    --on-accent: #0e1014;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    max-width: 480px;
    min-height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .pill.bad .dot { background: var(--bad); }

  .status {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 20px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px;
  }
  .status .badge {
    width: 56px; height: 56px; border-radius: 16px; flex: none;
    display: grid; place-items: center;
    background: var(--surface-2); color: var(--muted);
    transition: background .2s, color .2s;
  }
  .status .badge svg { width: 28px; height: 28px; }
  .status .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .status .mode { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .status[data-mode="ambient"] .badge { background: var(--ambient-soft); color: var(--ambient); }
  .status[data-mode="spotlight"] .badge { background: var(--spot-soft); color: var(--spot); }
  .status[data-mode="deactivate"] .badge { background: var(--off-soft); color: var(--off); }
  .status[data-mode="active"] .badge { background: var(--ok-soft); color: var(--ok); }

  .status .phone { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .status .phone .dot { width: 7px; height: 7px; }
  .status .phone.held { color: var(--ok); }
  .status .phone.held .dot { background: var(--ok); }
  .camera { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .camera-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
  .camera-head .label { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .camera-head .live { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .camera.streaming .camera-head .live { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
  .camera-view { position: relative; aspect-ratio: 4 / 3; background: #000; display: grid; place-items: center; }
  .camera-view img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .camera:not(.streaming) .camera-view img { visibility: hidden; }  /* no broken-image text while connecting */
  .camera-view .note { position: absolute; color: #c8ccd4; font-size: 14px; text-align: center; padding: 0 16px; }
  .camera.hidden .camera-view { display: none; }
  .sound {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  }
  .sound-head { display: flex; align-items: center; gap: 14px; }
  .sound .badge {
    width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: var(--surface-2); color: var(--muted); transition: background .2s, color .2s;
  }
  .sound .badge svg { width: 24px; height: 24px; }
  .sound .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .sound-who { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: inherit; background: var(--muted); transition: width .25s ease, background .2s; }
  .sound[data-kind="person"] .meter-fill { background: var(--spot); }
  .sound[data-kind="person"] .badge { background: var(--spot-soft); color: var(--spot); }
  .sound[data-kind="us"] .meter-fill { background: var(--ambient); }
  .sound[data-kind="us"] .badge { background: var(--ambient-soft); color: var(--ambient); }
  .sound-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sound-switches { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .sound-hint { font-size: 13px; color: var(--muted); }
  .sound-hint.on { color: var(--ambient); font-weight: 600; }
  .switch {
    display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 13px; font-weight: 600; color: var(--muted);
    background: none; padding: 4px 0;
  }
  .switch i {
    position: relative; width: 40px; height: 24px; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--border); transition: background .2s;
  }
  .switch i::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s;
  }
  .switch[aria-checked="true"] { color: var(--text); }
  .switch[aria-checked="true"] i { background: var(--ambient); border-color: var(--ambient); }
  .switch[aria-checked="true"] i::after { transform: translateX(16px); }
  .switch:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; border-radius: 6px; }

  .spacer { flex: 1; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px -8px; text-transform: uppercase; letter-spacing: .06em; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .btn {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 18px; min-height: 148px;
    border-radius: 20px; text-align: left;
    background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow);
    transition: transform .08s ease, background .2s, border-color .2s, color .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .btn .icon {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    transition: background .2s, color .2s;
  }
  .btn .icon svg { width: 26px; height: 26px; }
  .btn .name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .btn .hint { font-size: 13px; color: var(--muted); margin-top: 2px; transition: color .2s; }
  .btn .check {
    position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; opacity: 0; transform: scale(.6);
    transition: opacity .2s, transform .2s;
    background: var(--on-accent);
  }
  .btn .check svg { width: 14px; height: 14px; }

  .btn[data-mode="ambient"] .icon { background: var(--ambient-soft); color: var(--ambient); }
  .btn[data-mode="spotlight"] .icon { background: var(--spot-soft); color: var(--spot); }

  .btn[data-mode="ambient"].active { background: var(--ambient); border-color: var(--ambient); color: var(--on-accent); }
  .btn[data-mode="spotlight"].active { background: var(--spot); border-color: var(--spot); color: var(--on-accent); }
  .btn.active .icon { background: color-mix(in srgb, var(--on-accent) 22%, transparent); color: var(--on-accent); }
  .btn.active .hint { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
  .btn.active .check { opacity: 1; transform: scale(1); }
  .btn[data-mode="ambient"] .check { color: var(--ambient); }
  .btn[data-mode="spotlight"] .check { color: var(--spot); }

  .btn-off {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 64px; border-radius: 18px;
    font-size: 18px; font-weight: 700;
    background: var(--off-soft); color: var(--off); border: 1.5px solid transparent;
    transition: transform .08s ease, background .2s, color .2s;
  }
  .btn-off svg { width: 22px; height: 22px; }
  .btn-off:active { transform: scale(.98); }
  .btn-off.activate { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .btn-off.confirm { background: var(--ok); color: var(--on-accent); border-color: var(--ok); }
  body.deactivated .modes { opacity: .45; }
  .btn-off:focus-visible { outline: 3px solid var(--off); outline-offset: 2px; }

  .phone-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-phone {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 60px; padding: 0 14px; border-radius: 18px;
    font-size: 16px; font-weight: 700;
    background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow);
    transition: transform .08s ease, background .2s, border-color .2s, color .2s;
  }
  .btn-phone svg { width: 24px; height: 24px; flex: none; }
  .btn-phone:active { transform: scale(.97); }
  .btn-phone:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .btn-phone[data-action="grip"].on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .btn-phone[data-action="release"].on { background: var(--surface-2); color: var(--muted); }
  .btn-phone.confirm { background: var(--off); border-color: var(--off); color: var(--on-accent); }
  .btn-phone .spinner { right: 14px; }
  .btn-rotate {
    position: relative; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    min-height: 60px; padding: 10px 16px; border-radius: 18px;
    background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow);
    transition: transform .08s ease, background .2s, border-color .2s;
  }
  .btn-rotate:active { transform: scale(.98); }
  .btn-rotate:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .btn-rotate .turn { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: var(--ambient-soft); color: var(--ambient); transition: transform .3s ease; }
  .btn-rotate .turn svg { width: 24px; height: 24px; }
  .btn-rotate.landscape .turn { transform: scaleX(-1); }  /* the arrow points the way the next turn goes */
  .btn-rotate .name { display: block; font-size: 16px; font-weight: 700; }
  .btn-rotate .hint { display: block; font-size: 13px; color: var(--muted); }
  .btn-rotate .orient { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .btn-rotate.landscape .orient { background: var(--ambient-soft); color: var(--ambient); }
  .btn-rotate.offline { opacity: .5; }
  .btn-rotate .spinner { right: 16px; }
  .btn-rotate.pending .orient { visibility: hidden; }
  .btn-phone.pending::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: color-mix(in srgb, var(--bg) 35%, transparent);
  }

  .btn-test {
    position: relative; width: 100%;
    display: flex; align-items: center; gap: 14px; text-align: left;
    min-height: 64px; padding: 10px 16px; border-radius: 18px;
    background: var(--surface); border: 1.5px dashed var(--border);
    transition: transform .08s ease, background .2s, border-color .2s, color .2s;
  }
  .btn-test svg { width: 24px; height: 24px; flex: none; color: var(--ambient); }
  .btn-test .name { display: block; font-size: 16px; font-weight: 700; }
  .btn-test .hint { display: block; font-size: 13px; color: var(--muted); }
  .btn-test:active { transform: scale(.98); }
  .btn-test:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .btn-test.offline { opacity: .55; }
  .btn-test.confirm { background: var(--off); border: 1.5px solid var(--off); color: var(--on-accent); }
  .btn-test.confirm svg, .btn-test.confirm .hint { color: var(--on-accent); }
  .btn-test.running { border: 1.5px solid var(--ambient); background: var(--ambient-soft); }
  .btn-test.running svg { animation: spin 1.2s linear infinite; }

  .move { display: flex; align-items: center; gap: 16px; }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 6px;
    flex: none; touch-action: none;
  }
  .dpad button {
    display: grid; place-items: center; border-radius: 16px;
    background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow); color: var(--text);
    transition: transform .06s ease, background .15s, border-color .15s, color .15s;
  }
  .dpad button svg { width: 26px; height: 26px; }
  .dpad button.held { transform: scale(.94); background: var(--ambient-soft); border-color: var(--ambient); color: var(--ambient); }
  .dpad button:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .dpad [data-dir="up"] { grid-area: 1 / 2; }
  .dpad [data-dir="left"] { grid-area: 2 / 1; }
  .dpad [data-dir="right"] { grid-area: 2 / 3; }
  .dpad [data-dir="down"] { grid-area: 3 / 2; }
  .dpad .center { grid-area: 2 / 2; border-radius: 50%; color: var(--muted); background: var(--surface-2); box-shadow: none; }
  .dpad .center svg { width: 22px; height: 22px; }
  .dpad .center.resume { background: var(--ambient); border-color: var(--ambient); color: var(--on-accent); }
  .move-info .name { display: block; font-size: 16px; font-weight: 700; }
  .move-info .hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .move.disabled .dpad { opacity: .45; }

  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .person {
    position: relative; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px;
    border-radius: 16px; background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow);
    font-size: 16px; font-weight: 700; text-align: left;
    transition: transform .08s ease, background .2s, border-color .2s, color .2s;
  }
  .person:active { transform: scale(.97); }
  .person:focus-visible { outline: 3px solid var(--ambient); outline-offset: 2px; }
  .person .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--ambient-soft); color: var(--ambient); font-size: 15px; font-weight: 800;
  }
  .person.on { background: var(--ambient); border-color: var(--ambient); color: var(--on-accent); }
  .person.on .avatar { background: color-mix(in srgb, var(--on-accent) 22%, transparent); color: var(--on-accent); }
  .person.found::after {
    content: ""; position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 0 2px var(--surface);
  }
  .people-hint { font-size: 13px; color: var(--muted); margin: -8px 4px 0; min-height: 1.2em; }
  .people-hint.on { color: var(--ambient); font-weight: 600; }
  body.deactivated .people { opacity: .45; }

  .busy { pointer-events: none; }
  .btn.pending::after, .btn-off.pending::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: color-mix(in srgb, var(--bg) 35%, transparent);
  }
  .btn-off { position: relative; }
  .spinner {
    display: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite; position: absolute; z-index: 1;
  }
  .btn .spinner { top: 18px; right: 18px; }
  .btn-off .spinner { right: 20px; }
  .pending .spinner { display: block; }
  .pending .check { opacity: 0 !important; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .host { text-align: center; font-size: 12px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    max-width: calc(100% - 32px);
    background: var(--text); color: var(--bg);
    padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::after { transition: none !important; animation-duration: 1.5s !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">FollowMe<small>Arm remote</small></div>
    <div class="pill" id="conn" role="status" aria-live="polite"><span class="dot"></span><span id="connText">Connecting…</span></div>
  </header>

  <section class="status" id="status" data-mode="" aria-live="polite">
    <div class="badge" id="statusIcon"></div>
    <div>
      <div class="label">Current mode</div>
      <div class="mode" id="statusMode">—</div>
      <div class="phone" id="phoneState"><span class="dot"></span><span id="phoneText">Phone —</span></div>
    </div>
  </section>

  <section class="camera" id="camera" aria-label="Camera">
    <div class="camera-head">
      <span class="label"><span class="live" aria-hidden="true"></span>Camera</span>
      <button class="switch" id="cameraSwitch" role="switch" aria-checked="true"><span>Show</span><i aria-hidden="true"></i></button>
    </div>
    <div class="camera-view">
      <img id="cameraImg" alt="Live view from the robot's camera">
      <span class="note" id="cameraNote">Connecting to the camera…</span>
    </div>
  </section>

  <section class="sound" id="sound" data-kind="" aria-label="Sound">
    <div class="sound-head">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
      <div><div class="label">Hearing</div><div class="sound-who" id="soundWho" aria-live="polite">—</div></div>
    </div>
    <div class="meter" role="meter" aria-label="Sound level" aria-valuemin="0" aria-valuemax="100" id="meter"><div class="meter-fill" id="meterFill"></div></div>
    <div class="sound-foot">
      <div class="sound-hint" id="soundHint">Checking the tracker…</div>
      <div class="sound-switches">
        <button class="switch" id="micSwitch" role="switch" aria-checked="false"><span>Use this phone's mic</span><i aria-hidden="true"></i></button>
        <button class="switch" id="followSwitch" role="switch" aria-checked="false"><span>Go to whoever speaks</span><i aria-hidden="true"></i></button>
      </div>
    </div>
  </section>

  <div class="spacer"></div>

  <div class="section-title">Go to</div>
  <section class="people" id="people" aria-label="Go to a person"></section>
  <div class="people-hint" id="peopleHint" aria-live="polite">Checking the tracker…</div>

  <div class="section-title">Mode</div>
  <section class="modes">
    <button class="btn" data-mode="ambient" aria-pressed="false">
      <span class="spinner" aria-hidden="true"></span>
      <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      </span>
      <span><span class="name">Ambient</span><span class="hint" style="display:block">Sweep West ↔ East</span></span>
    </button>
    <button class="btn" data-mode="spotlight" aria-pressed="false">
      <span class="spinner" aria-hidden="true"></span>
      <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"/><path d="M5.5 21c.8-3.6 3.4-6 6.5-6s5.7 2.4 6.5 6"/><path d="M12 1.5v1M4.5 4.5l.8.8M19.5 4.5l-.8.8"/></svg>
      </span>
      <span><span class="name">Spotlight</span><span class="hint" style="display:block">Follow people</span></span>
    </button>
  </section>

  <div class="section-title">Phone</div>
  <section class="phone-row">
    <button class="btn-phone" data-action="release" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="4" width="6" height="16" rx="1.5"/><path d="M6 12H2m2-2-2 2 2 2M18 12h4m-2-2 2 2-2 2"/></svg>
      <span class="label">Release</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
    <button class="btn-phone" data-action="grip" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="4" width="6" height="16" rx="1.5"/><path d="M2 12h4m-2-2 2 2-2 2M22 12h-4m2-2-2 2 2 2"/></svg>
      <span class="label">Grip</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
  </section>
  <button class="btn-rotate" id="rotateBtn" aria-pressed="false">
    <span class="turn" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
    <span><span class="name" id="rotateName">Turn to landscape</span><span class="hint" id="rotateHint">↺ counter-clockwise</span></span>
    <span class="orient" id="orientBadge">Portrait</span>
    <span class="spinner" aria-hidden="true"></span>
  </button>

  <div class="section-title">Move</div>
  <section class="move" id="move">
    <div class="dpad" role="group" aria-label="Move the arm">
      <button data-dir="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button data-dir="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="center" id="resumeBtn" aria-label="Resume tracking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
      <button data-dir="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button data-dir="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="move-info"><span class="name" id="moveName">Tracking</span><span class="hint" id="moveHint">Press an arrow to steer by hand</span></div>
  </section>

  <button class="btn-test offline" id="testBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    <span><span class="name" id="testName">Motor test</span><span class="hint" id="testHint">Checking tracker…</span></span>
  </button>

  <button class="btn-off" id="masterBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    <span id="offLabel">Deactivate</span>
    <span class="spinner" aria-hidden="true"></span>
  </button>

  <div class="host" id="host"></div>
</main>

<div class="toast" id="toast" role="alert"></div>

<script>
  const MODES = {
    ambient: { name: "Ambient" },
    spotlight: { name: "Spotlight" },
  };
  const ICONS = {
    ambient: document.querySelector('.btn[data-mode="ambient"] .icon').innerHTML,
    spotlight: document.querySelector('.btn[data-mode="spotlight"] .icon').innerHTML,
    deactivated: document.querySelector('.btn-off svg').outerHTML,
  };

  const buttons = [...document.querySelectorAll("[data-mode]")].filter(el => el.tagName === "BUTTON");
  const conn = document.getElementById("conn");
  const connText = document.getElementById("connText");
  const statusBox = document.getElementById("status");
  const toast = document.getElementById("toast");
  document.getElementById("host").textContent = location.host;

  const phoneButtons = [...document.querySelectorAll(".btn-phone")];
  let currentMode = null;
  let held = null;
  let confirmTimer;
  let tracker = { reachable: false };
  let testUntil = 0;
  let testConfirmTimer;
  const testBtn = document.getElementById("testBtn");
  let busy = false;
  let toastTimer;
  let deactivated = null;
  let masterConfirmTimer;
  const masterBtn = document.getElementById("masterBtn");

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }

  function setConnected(ok) {
    conn.classList.toggle("ok", ok);
    conn.classList.toggle("bad", !ok);
    connText.textContent = ok ? "Connected" : "Offline";
  }

  function render(mode) {
    currentMode = mode;
    renderStatus();
    for (const b of buttons) {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", String(on));
    }
  }

  function renderStatus() {
    const off = deactivated === true;
    statusBox.dataset.mode = off ? "deactivate" : currentMode || (deactivated === false ? "active" : "");
    document.getElementById("statusMode").textContent =
      off ? "Deactivated" : currentMode ? MODES[currentMode].name : deactivated === false ? "Active" : "—";
    document.getElementById("statusIcon").innerHTML =
      currentMode && !off ? ICONS[currentMode] : deactivated === null ? "" : ICONS.deactivated;
  }

  function renderMaster(isDeactivated) {
    deactivated = isDeactivated;
    document.body.classList.toggle("deactivated", isDeactivated === true);
    if (!masterBtn.classList.contains("confirm")) {
      masterBtn.classList.toggle("activate", isDeactivated === true);
      document.getElementById("offLabel").textContent = isDeactivated ? "Activate" : "Deactivate";
    }
    masterBtn.setAttribute("aria-pressed", String(isDeactivated === true));
    renderStatus();
    renderTest();
    renderMove();
  }

  function clearMasterConfirm() {
    clearTimeout(masterConfirmTimer);
    masterBtn.classList.remove("confirm");
    renderMaster(deactivated);
  }

  async function sendMaster() {
    const activate = deactivated === true;
    // Deactivating is immediate and overrides anything in progress; activating restarts motion, so confirm.
    if (activate && !masterBtn.classList.contains("confirm")) {
      navigator.vibrate?.(12);
      masterBtn.classList.remove("activate");
      masterBtn.classList.add("confirm");
      document.getElementById("offLabel").textContent = "Tap again to activate";
      masterConfirmTimer = setTimeout(clearMasterConfirm, 3000);
      return;
    }
    if (activate && busy) return;
    clearTimeout(masterConfirmTimer);
    masterBtn.classList.remove("confirm");
    navigator.vibrate?.(activate ? 12 : [30, 30, 30]);
    masterBtn.classList.add("pending");
    try {
      const data = await request("/api/active", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: activate }),
      });
      setConnected(true);
      if (!activate) testUntil = 0;
      renderMaster(data.deactivated);
    } catch (err) {
      showToast(err.name === "AbortError" ? "No response from the arm controller"
        : `Couldn't ${activate ? "activate" : "deactivate"}: ${err.message}`);
      renderMaster(deactivated);
    } finally {
      masterBtn.classList.remove("pending");
    }
  }

  function renderPhone(isHeld) {
    held = isHeld;
    const line = document.getElementById("phoneState");
    line.classList.toggle("held", isHeld === true);
    document.getElementById("phoneText").textContent =
      isHeld === null ? "Phone —" : isHeld ? "Phone held" : "Phone released";
    for (const b of phoneButtons) {
      const on = (b.dataset.action === "grip") === isHeld;
      b.classList.toggle("on", isHeld !== null && on);
      b.setAttribute("aria-pressed", String(isHeld !== null && on));
    }
  }

  function clearConfirm() {
    clearTimeout(confirmTimer);
    const b = document.querySelector('.btn-phone[data-action="release"]');
    b.classList.remove("confirm");
    b.querySelector(".label").textContent = "Release";
  }

  const moveBox = document.getElementById("move");
  const resumeBtn = document.getElementById("resumeBtn");
  let manual = false;
  let moveInFlight = false;
  let repeatTimer = null;

  const followSwitch = document.getElementById("followSwitch");

  function renderVoice() {
    const v = tracker.reachable ? (tracker.voice || {}) : null;
    const box = document.getElementById("sound");
    const who = document.getElementById("soundWho");
    const hint = document.getElementById("soundHint");
    const fill = document.getElementById("meterFill");
    const speakerOn = tracker.follow_mode === "speaker";
    followSwitch.setAttribute("aria-checked", String(speakerOn));
    followSwitch.disabled = !tracker.reachable;
    let kind = "", label, level = 0;
    const live = v && v.age !== null && v.age !== undefined && v.age <= 3;
    if (!v) label = "—";
    else if (!live) label = "No microphone";
    else {
      if (v.level !== null && v.level !== undefined) level = Math.max(0, Math.min(1, (v.level + 60) / 50));
      if (v.speaker === "silence") label = "Silent";
      else if ((v.targets || []).includes(v.speaker)) { label = v.speaker; kind = "us"; }
      else { label = "Random person"; kind = "person"; }  // includes voices that are still placeholders
    }
    box.dataset.kind = kind;
    who.textContent = label;
    fill.style.width = `${Math.round(level * 100)}%`;
    document.getElementById("meter").setAttribute("aria-valuenow", String(Math.round(level * 100)));
    const going = speakerOn && tracker.active_target && tracker.active_target === tracker.voice_following;
    hint.classList.toggle("on", Boolean(going));
    if (!v) hint.textContent = "Tracker offline";
    else if (!v.targets || !v.targets.length) hint.textContent = "No voices enrolled";
    else if (phoneMic.problem) hint.textContent = phoneMic.problem;
    else if (!live && phoneMic.on) hint.textContent = "Phone mic on · waiting for the voice listener";
    else if (!live) hint.textContent = phoneMic.wanted ? "Tap “Use this phone's mic” to listen again"
      : "Turn on “Use this phone's mic”";
    else if (going) hint.textContent = (tracker.motion_blocker || "").startsWith("searching")
      ? `Looking for ${tracker.active_target}…` : `Going to ${tracker.active_target}`;
    else if (!speakerOn) hint.textContent = "Voice won't move the arm";
    else hint.textContent = "Speak and it comes to you";
  }

  // ---- live camera, relayed by the app from the tracker ----
  const cameraBox = document.getElementById("camera");
  const cameraImg = document.getElementById("cameraImg");
  const cameraNote = document.getElementById("cameraNote");
  const cameraSwitch = document.getElementById("cameraSwitch");
  let cameraWanted = true, cameraRetry = null;
  try { cameraWanted = localStorage.getItem("camera") !== "off"; } catch {}

  function cameraConnect() {
    clearTimeout(cameraRetry);
    if (!cameraWanted || document.hidden) { cameraImg.removeAttribute("src"); cameraBox.classList.remove("streaming"); return; }
    cameraNote.textContent = "Connecting to the camera…";
    cameraNote.hidden = false;
    cameraImg.src = `/api/stream?t=${Date.now()}`;  // a fresh URL so a dropped stream really reconnects
  }
  cameraImg.addEventListener("load", () => { cameraNote.hidden = true; cameraBox.classList.add("streaming"); });
  cameraImg.addEventListener("error", () => {
    cameraBox.classList.remove("streaming");
    cameraNote.hidden = false;
    cameraNote.textContent = tracker.reachable ? "Camera unavailable — retrying…" : "Camera offline — start ./robot";
    cameraRetry = setTimeout(cameraConnect, 3000);
  });
  function renderCamera() {
    cameraBox.classList.toggle("hidden", !cameraWanted);
    cameraSwitch.setAttribute("aria-checked", String(cameraWanted));
    if (cameraWanted && cameraImg.getAttribute("src") && cameraImg.naturalWidth > 0) {  // frames are arriving
      cameraNote.hidden = true;
      cameraBox.classList.add("streaming");
    }
  }
  cameraSwitch.addEventListener("click", () => {
    cameraWanted = !cameraWanted;
    try { localStorage.setItem("camera", cameraWanted ? "on" : "off"); } catch {}
    renderCamera();
    cameraConnect();
  });
  document.addEventListener("visibilitychange", cameraConnect);  // close the stream while the page is hidden
  renderCamera();
  cameraConnect();

  // ---- phone microphone -> robot (16 kHz 16-bit mono PCM, posted every 250 ms) ----
  const micSwitch = document.getElementById("micSwitch");
  const phoneMic = { on: false, wanted: false, problem: "", stream: null, ctx: null, node: null, timer: null,
                     wakeLock: null, queue: [], sending: false, lastToast: 0 };
  try { phoneMic.wanted = localStorage.getItem("phoneMic") === "on"; } catch {}

  function micResample(state, input, rate) {
    // Box-filter average over each output period: a cheap low-pass plus decimation to 16 kHz.
    const ratio = rate / 16000;
    const data = new Float32Array(state.rest.length + input.length);
    data.set(state.rest); data.set(input, state.rest.length);
    const out = [];
    let pos = state.pos;
    while (pos + ratio <= data.length) {
      const a = Math.floor(pos), b = Math.max(a + 1, Math.floor(pos + ratio));
      let sum = 0;
      for (let i = a; i < b; i++) sum += data[i];
      const v = Math.max(-1, Math.min(1, sum / (b - a)));
      out.push(v < 0 ? v * 32768 : v * 32767);
      pos += ratio;
    }
    const keep = Math.floor(pos);
    state.rest = data.slice(keep);
    state.pos = pos - keep;
    return out;
  }

  async function micFlush() {
    if (phoneMic.sending || !phoneMic.queue.length) return;
    let samples = phoneMic.queue.splice(0);
    if (samples.length > 32000) samples = samples.slice(-32000);  // never fall more than 2 s behind
    phoneMic.sending = true;
    try {
      const res = await fetch("/api/audio", { method: "POST", headers: { "Content-Type": "application/octet-stream" },
                                              body: new Int16Array(samples).buffer, cache: "no-store" });
      if (res.status === 204) phoneMic.problem = "";
      else phoneMic.problem = ((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    } catch {
      phoneMic.problem = "Can't reach the robot";
    } finally {
      phoneMic.sending = false;
    }
  }

  async function micStart() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast("The mic needs the secure https:// address — reopen the app from the QR code");
      return;
    }
    try {
      phoneMic.stream = await navigator.mediaDevices.getUserMedia({ audio: {
        channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    } catch (err) {
      showToast(err.name === "NotAllowedError" ? "Microphone permission was denied" : `Couldn't open the mic: ${err.message}`);
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    phoneMic.ctx = new Ctx();
    await phoneMic.ctx.resume();
    const source = phoneMic.ctx.createMediaStreamSource(phoneMic.stream);
    phoneMic.node = phoneMic.ctx.createScriptProcessor(4096, 1, 1);
    const resampler = { rest: new Float32Array(0), pos: 0 };
    phoneMic.node.onaudioprocess = e => {
      const out = micResample(resampler, e.inputBuffer.getChannelData(0), phoneMic.ctx.sampleRate);
      for (const v of out) phoneMic.queue.push(v);
    };
    const mute = phoneMic.ctx.createGain();
    mute.gain.value = 0;  // the processor must reach the output to run, but nothing should be played
    source.connect(phoneMic.node); phoneMic.node.connect(mute); mute.connect(phoneMic.ctx.destination);
    phoneMic.timer = setInterval(micFlush, 250);
    try { phoneMic.wakeLock = await navigator.wakeLock?.request("screen"); } catch {}  // phones stop the mic when the screen locks
    phoneMic.on = phoneMic.wanted = true;
    phoneMic.problem = "";
    try { localStorage.setItem("phoneMic", "on"); } catch {}
  }

  function micStop(remember = true) {
    clearInterval(phoneMic.timer);
    phoneMic.node?.disconnect();
    phoneMic.stream?.getTracks().forEach(t => t.stop());
    phoneMic.ctx?.close();
    phoneMic.wakeLock?.release?.().catch?.(() => {});
    Object.assign(phoneMic, { on: false, stream: null, ctx: null, node: null, timer: null, wakeLock: null, queue: [], problem: "" });
    if (remember) {
      phoneMic.wanted = false;
      try { localStorage.setItem("phoneMic", "off"); } catch {}
    }
  }

  micSwitch.addEventListener("click", async () => {
    navigator.vibrate?.(10);
    if (phoneMic.on) micStop(); else await micStart();
    micSwitch.setAttribute("aria-checked", String(phoneMic.on));
    renderVoice();
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden || !phoneMic.on) return;
    try { await phoneMic.ctx.resume(); } catch {}
    try { phoneMic.wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  });

  followSwitch.addEventListener("click", async () => {
    const mode = tracker.follow_mode === "speaker" ? "manual" : "speaker";
    navigator.vibrate?.(10);
    try {
      const data = await request("/api/follow", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode }),
      });
      tracker.follow_mode = data.follow_mode;
      renderVoice();
    } catch (err) {
      showToast(`Couldn't change voice following: ${err.message}`);
    }
  });

  const peopleBox = document.getElementById("people");
  let shownFaces = "";

  function renderPeople() {
    const faces = tracker.reachable ? (tracker.faces || []) : [];
    if (faces.join("|") !== shownFaces) {  // rebuild only when someone is enrolled or removed
      shownFaces = faces.join("|");
      peopleBox.replaceChildren(...faces.map(name => {
        const b = document.createElement("button");
        b.className = "person";
        b.dataset.name = name;
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.textContent = name.slice(0, 1).toUpperCase();
        avatar.setAttribute("aria-hidden", "true");
        b.append(avatar, document.createTextNode(name));
        b.addEventListener("click", () => sendFind(name));
        return b;
      }));
    }
    const finding = tracker.finding;
    const found = finding && tracker.seeking === finding && tracker.target_visible;
    for (const b of peopleBox.children) {
      const on = b.dataset.name === finding;
      b.classList.toggle("on", on);
      b.classList.toggle("found", on && Boolean(found));
      b.setAttribute("aria-pressed", String(on));
    }
    const hint = document.getElementById("peopleHint");
    const searching = (tracker.motion_blocker || "").startsWith("searching");
    hint.classList.toggle("on", Boolean(finding));
    if (!tracker.reachable) hint.textContent = "Tracker offline";
    else if (!faces.length) hint.textContent = "No faces enrolled yet — use Enroll face on the tracker page";
    else if (finding && deactivated) hint.textContent = `Going to ${finding} · paused while deactivated`;
    else if (finding && tracker.frozen) hint.textContent = `Going to ${finding} · paused (manual)`;
    else if (finding && found) hint.textContent = `Following ${finding} · tap again to stop`;
    else if (finding && searching) hint.textContent = `Looking for ${finding}… sweeping the room`;
    else if (finding) hint.textContent = `Going to ${finding}…`;
    else hint.textContent = "Tap a name and the arm will find that person";
  }

  async function sendFind(name) {
    if (!tracker.reachable) { showToast("The tracker isn't reachable from the controller"); return; }
    if (deactivated) { showToast("The arm is deactivated — tap Activate first"); return; }
    const target = tracker.finding === name ? null : name;  // tapping the active person stops
    navigator.vibrate?.(12);
    try {
      await request("/api/find", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: target }),
      });
      setConnected(true);
      tracker.finding = target;
      if (target) tracker.frozen = false;
      renderPeople();
      renderMove();
    } catch (err) {
      showToast(err.name === "AbortError" ? "No response from the arm controller" : `Couldn't go to ${name}: ${err.message}`);
    }
  }

  const rotateBtn = document.getElementById("rotateBtn");
  let rotateUntil = 0;

  function renderRotate() {
    const landscape = tracker.orientation === "landscape";
    const turning = Date.now() < rotateUntil;
    rotateBtn.classList.toggle("landscape", landscape);
    rotateBtn.classList.toggle("pending", turning);
    rotateBtn.classList.toggle("offline", !tracker.reachable || deactivated === true);
    rotateBtn.setAttribute("aria-pressed", String(landscape));
    document.getElementById("orientBadge").textContent = landscape ? "Landscape" : "Portrait";
    document.getElementById("rotateName").textContent = turning ? "Turning…" : landscape ? "Turn back to portrait" : "Turn to landscape";
    document.getElementById("rotateHint").textContent = landscape ? "↻ clockwise" : "↺ counter-clockwise";
  }

  rotateBtn.addEventListener("click", async () => {
    if (!tracker.reachable) { showToast("The tracker isn't reachable from the controller"); return; }
    if (deactivated) { showToast("The arm is deactivated — tap Activate first"); return; }
    if (Date.now() < rotateUntil) return;
    const orientation = tracker.orientation === "landscape" ? "portrait" : "landscape";
    navigator.vibrate?.(12);
    try {
      await request("/api/orientation", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ orientation }) });
      rotateUntil = Date.now() + 1800;  // the wrist takes about 1.5 s to turn
      tracker.orientation = orientation;
      renderRotate();
      setTimeout(renderRotate, 1900);
    } catch (err) {
      showToast(`Couldn't rotate the phone: ${err.message}`);
    }
  });

  function renderMove() {
    const unavailable = !tracker.reachable || deactivated === true;
    manual = tracker.frozen === true;
    moveBox.classList.toggle("disabled", unavailable);
    resumeBtn.classList.toggle("resume", manual && !unavailable);
    const name = document.getElementById("moveName");
    const hint = document.getElementById("moveHint");
    if (!tracker.reachable) { name.textContent = "Move"; hint.textContent = "Tracker offline"; }
    else if (deactivated) { name.textContent = "Move"; hint.textContent = "Deactivated — activate to move"; }
    else if (manual) { name.textContent = "Manual"; hint.textContent = "Tracking paused · tap the centre to resume"; }
    else { name.textContent = "Tracking"; hint.textContent = "Press an arrow to steer by hand"; }
  }

  async function sendMove(direction) {
    if (moveInFlight) return;  // hold-to-repeat never queues up a backlog
    moveInFlight = true;
    try {
      const data = await request("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction }),
      });
      setConnected(true);
      tracker.frozen = direction !== "resume";
      renderMove();
      return data;
    } catch (err) {
      stopRepeat();
      showToast(err.name === "AbortError" ? "No response from the arm controller" : `Couldn't move: ${err.message}`);
    } finally {
      moveInFlight = false;
    }
  }

  function stopRepeat() {
    clearInterval(repeatTimer);
    repeatTimer = null;
    document.querySelectorAll(".dpad button.held").forEach(b => b.classList.remove("held"));
  }

  function startRepeat(button) {
    if (!tracker.reachable) { showToast("The tracker isn't reachable from the controller"); return; }
    if (deactivated) { showToast("The arm is deactivated — tap Activate first"); return; }
    stopRepeat();
    button.classList.add("held");
    navigator.vibrate?.(8);
    sendMove(button.dataset.dir);
    repeatTimer = setInterval(() => sendMove(button.dataset.dir), 300);
  }

  function renderTest() {
    const running = Date.now() < testUntil;
    if (testBtn.classList.contains("confirm")) return;
    testBtn.classList.toggle("running", running);
    testBtn.classList.toggle("offline", (!tracker.reachable || deactivated === true) && !running);
    const name = document.getElementById("testName");
    const hint = document.getElementById("testHint");
    if (running) {
      name.textContent = "Moving…";
      hint.textContent = `Sweeping and lifting the arm · ${Math.ceil((testUntil - Date.now()) / 1000)} s`;
      return;
    }
    name.textContent = "Motor test";
    const last = tracker.last_command;
    if (!tracker.reachable) hint.textContent = "Tracker offline — start tracker/track.py";
    else if (deactivated) hint.textContent = "Deactivated — activate to run the test";
    else if (last && last.command === "test_motion") hint.textContent = `Last test: ${last.result}`;
    else if (tracker.dry_run) hint.textContent = "Tracker in dry run — motors won't move";
    else hint.textContent = held === false ? "Arm and gripper for 10 s" : "Arm for 10 s · release the phone to test the gripper";
  }

  function clearTestConfirm() {
    clearTimeout(testConfirmTimer);
    testBtn.classList.remove("confirm");
    renderTest();
  }

  async function sendTest() {
    if (busy || Date.now() < testUntil) return;
    if (!tracker.reachable) { showToast("The tracker isn't reachable from the controller"); return; }
    if (deactivated) { showToast("The arm is deactivated — tap Activate first"); return; }
    if (!testBtn.classList.contains("confirm")) {
      navigator.vibrate?.(12);
      testBtn.classList.remove("offline", "running");
      testBtn.classList.add("confirm");
      document.getElementById("testName").textContent = "Tap again to move the arm";
      document.getElementById("testHint").textContent = "Keep hands clear";
      testConfirmTimer = setTimeout(clearTestConfirm, 3000);
      return;
    }
    clearTestConfirm();
    busy = true;
    navigator.vibrate?.([20, 40, 20]);
    try {
      await request("/api/test-motion", { method: "POST" });
      testUntil = Date.now() + 11500;  // 10 s of motion + easing back
      renderTest();
    } catch (err) {
      showToast(err.name === "AbortError" ? "No response from the arm controller" : `Test failed: ${err.message}`);
    } finally {
      busy = false;
    }
  }

  async function request(path, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    try {
      const res = await fetch(path, { ...options, signal: controller.signal, cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  // A bug in one section must not blank the others or masquerade as a lost connection.
  function safely(fn, ...args) {
    try { fn(...args); } catch (err) { console.error(`${fn.name} failed:`, err); }
  }

  async function poll() {
    let data;
    try {
      data = await request("/api/status");
    } catch {
      setConnected(false);
      tracker = { reachable: false };
      for (const fn of [renderTest, renderMove, renderVoice, renderPeople, renderRotate]) safely(fn);
      return;
    }
    setConnected(true);
    if (!busy && data.mode !== currentMode) safely(render, data.mode);
    if (!busy && data.held !== held) safely(renderPhone, data.held);
    const turningTo = Date.now() < rotateUntil ? tracker.orientation : null;
    tracker = data.tracker || { reachable: false };
    if (turningTo) tracker.orientation = turningTo;  // show the new orientation while the wrist is still turning
    if (data.deactivated !== deactivated) safely(renderMaster, data.deactivated);
    for (const fn of [renderMove, renderVoice, renderPeople, renderTest, renderRotate, renderCamera]) safely(fn);
  }

  async function sendMode(mode, button) {
    if (busy || mode === currentMode) return;
    busy = true;
    navigator.vibrate?.(12);
    document.body.classList.add("busy");
    button.classList.add("pending");
    try {
      const data = await request("/api/mode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode }),
      });
      setConnected(true);
      render(data.mode);
    } catch (err) {
      setConnected(false);
      showToast(err.name === "AbortError" ? "No response from the arm controller" : `Couldn't switch: ${err.message}`);
    } finally {
      busy = false;
      button.classList.remove("pending");
      document.body.classList.remove("busy");
    }
  }

  async function sendGripper(action, button) {
    if (busy) return;
    if ((action === "grip") === held) return;
    // Releasing drops the phone: ask for a second tap within 3 s.
    if (action === "release" && !button.classList.contains("confirm")) {
      navigator.vibrate?.(12);
      button.classList.add("confirm");
      button.querySelector(".label").textContent = "Tap again";
      confirmTimer = setTimeout(clearConfirm, 3000);
      return;
    }
    clearConfirm();
    busy = true;
    navigator.vibrate?.(action === "release" ? [20, 40, 20] : 12);
    document.body.classList.add("busy");
    button.classList.add("pending");
    try {
      const data = await request("/api/gripper", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action }),
      });
      setConnected(true);
      renderPhone(data.held);
    } catch (err) {
      setConnected(false);
      showToast(err.name === "AbortError" ? "No response from the arm controller" : `Couldn't ${action}: ${err.message}`);
    } finally {
      busy = false;
      button.classList.remove("pending");
      document.body.classList.remove("busy");
    }
  }

  for (const b of buttons) b.addEventListener("click", () => sendMode(b.dataset.mode, b));
  for (const b of phoneButtons) b.addEventListener("click", () => sendGripper(b.dataset.action, b));
  testBtn.addEventListener("click", sendTest);
  masterBtn.addEventListener("click", sendMaster);
  for (const b of document.querySelectorAll(".dpad [data-dir]")) {
    b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); startRepeat(b); });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, stopRepeat);
    b.addEventListener("contextmenu", e => e.preventDefault());  // long-press menu on phones
  }
  resumeBtn.addEventListener("click", () => {
    if (!manual || deactivated) return;
    navigator.vibrate?.(12);
    sendMove("resume");
  });
  window.addEventListener("blur", stopRepeat);
  setInterval(() => { if (Date.now() < testUntil + 1000) renderTest(); }, 500);

  poll();
  setInterval(poll, 700);  // fast enough for the sound meter
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
