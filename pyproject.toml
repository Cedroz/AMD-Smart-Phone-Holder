[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "followme"
version = "0.1.0"
description = "Two-workstation SO-101 display prototype"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
followme = "followme.cli:main"
followme-phase2 = "followme.phase2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"followme.phase2" = ["console.html"]
