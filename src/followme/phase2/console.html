<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FollowMe — Camera diagnostics</title><style>
body{font:16px system-ui;background:#101820;color:#edf4f8;margin:24px auto;max-width:1000px;padding:0 18px}button,input{font:inherit;padding:8px;margin:5px}button{background:#a6e4cf;border:0;border-radius:6px;cursor:pointer}.view{position:relative;max-width:640px}img{width:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}pre{white-space:pre-wrap;background:#192632;padding:16px;border-radius:8px}.warn{color:#ffca79}</style>
<h1>Camera diagnostics · __ROLE__</h1><p class="warn">Camera-only session · Hold · No robot connection</p>
<div class="view"><img id="feed" src="/stream" alt="Live camera"><canvas id="canvas"></canvas></div>
<p><button id="reacquire">Reacquire participant</button><button id="refresh">Reconnect preview</button></p>
<section id="calibration"><h2>Workstation calibration</h2><p>Choose a station and drag its core region on the unmirrored image. Leave a neutral gap. This saves only Phase 2 zone configuration.</p>
<button data-zone="station_a">Draw station A</button><button data-zone="station_b">Draw station B</button>
<label>Exit margin <input id="margin" type="number" value="0.03" min="0" max="0.2" step="0.01"></label><button id="save">Save regions</button></section>
<p id="message" role="status"></p><pre id="status">Connecting…</pre>
<script>
const role='__ROLE__',feed=document.querySelector('#feed'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
let regions={},selected=null,start=null,dragging=false,loaded=false;
if(role!=='external')document.querySelector('#calibration').hidden=true;
function draw(){canvas.width=feed.naturalWidth||640;canvas.height=feed.naturalHeight||480;ctx.clearRect(0,0,canvas.width,canvas.height);for(const [name,r]of Object.entries(regions)){ctx.strokeStyle=name==='station_a'?'#a6e4cf':'#ffca79';ctx.lineWidth=3;ctx.strokeRect(r[0]*canvas.width,r[1]*canvas.height,(r[2]-r[0])*canvas.width,(r[3]-r[1])*canvas.height);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(name,r[0]*canvas.width+5,r[1]*canvas.height+15)}}
function point(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{selected=b.dataset.zone;document.querySelector('#message').textContent='Draw '+selected});
canvas.onpointerdown=e=>{if(!selected||role!=='external')return;start=point(e);dragging=true;canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!dragging)return;let p=point(e);regions[selected]=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];draw()};canvas.onpointerup=()=>{dragging=false};
async function post(url,body={}){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();document.querySelector('#message').textContent=r.ok?'Saved.':JSON.stringify(v);return v}catch(e){document.querySelector('#message').textContent=String(e)}}
document.querySelector('#save').onclick=()=>post('/api/zones',{regions,margin:Number(document.querySelector('#margin').value)});
document.querySelector('#reacquire').onclick=()=>post('/api/reacquire');document.querySelector('#refresh').onclick=()=>{feed.src='/stream?t='+Date.now()};feed.onload=draw;
async function poll(){try{let r=await fetch('/api/user-state',{cache:'no-store'}),s=await r.json();document.querySelector('#status').textContent=JSON.stringify(s,null,2);if(!loaded){regions=s.zones.regions||{};loaded=true;draw()}}catch(e){document.querySelector('#status').textContent='Session unavailable: '+e}setTimeout(poll,200)}poll();
</script></html>
